; Asterisk's manager interface (AMI), for the token-ring bridge only: sending text messages to
; the phone, and hearing texts back. Local connections only.
[general]
enabled = yes
bindaddr = 127.0.0.1
port = 5038

; The bridge's login lives outside the image: a file with
;   [token-ring]
;   secret = <a long random password>
;   read = user
;   write = message,command,originate   (originate: only for call apps that ring the phone)
; mounted at /run/secrets/manager_auth.conf in both the Asterisk and bridge containers
#tryinclude /run/secrets/manager_auth.conf
