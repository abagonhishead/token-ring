; Asterisk's manager interface (AMI), for the token-ring bridge (texts, the voicemail light, call
; apps) and the web page (status, reloads). Local connections only.
[general]
enabled = yes
bindaddr = 127.0.0.1
port = 5038
displayconnects = no           ; the web page logs in every few seconds

; The bridge's login lives outside the image: a file with
;   [token-ring]
;   secret = <a long random password>
;   read = user
;   write = message,command,call,originate   (call: the voicemail light; originate: call apps)
;   [token-ring-web]
;   secret = <another>
;   read = system,call,reporting
;   write = system,call,reporting,config,command
;   displayconnects = no         (it logs in every few seconds)
; mounted at /run/secrets/manager_auth.conf in the Asterisk, bridge and web containers
#tryinclude /run/secrets/manager_auth.conf
