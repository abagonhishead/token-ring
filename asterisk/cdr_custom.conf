; The call log on the web page reads this: /var/log/asterisk/cdr-custom/calls.csv, one line per
; call. Times are Unix times. "to" is who the PBX rang, for calls it placed (the bridge sets
; CDR(to)); "screen" is allowed or rejected, for calls in on a trunk ([caller-allowed]).
; Keep the columns in this order: the web page reads them by position.
[mappings]
calls.csv => ${CSV_QUOTE(${CDR(start,u)})},${CSV_QUOTE(${CDR(answer,u)})},${CSV_QUOTE(${CDR(end,u)})},${CSV_QUOTE(${CDR(duration)})},${CSV_QUOTE(${CDR(billsec)})},${CSV_QUOTE(${CDR(disposition)})},${CSV_QUOTE(${CDR(src)})},${CSV_QUOTE(${CDR(clid)})},${CSV_QUOTE(${CDR(dst)})},${CSV_QUOTE(${CDR(dcontext)})},${CSV_QUOTE(${CDR(channel)})},${CSV_QUOTE(${CDR(dstchannel)})},${CSV_QUOTE(${CDR(lastapp)})},${CSV_QUOTE(${CDR(uniqueid)})},${CSV_QUOTE(${CDR(to)})},${CSV_QUOTE(${CDR(screen)})}
