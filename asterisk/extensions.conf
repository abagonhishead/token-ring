[general]
static = yes
writeprotect = yes

[internal]
; Phones call each other
exten => _10X,1,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; The AI (200): the token-ring bridge's operator port. Starts with the operator; once put
; through to a session, the call stays there. Only the trusted phone (100) may call it: the
; sessions can run commands.
exten => 200,1,GotoIf($["${CHANNEL(endpoint)}" != "100"]?denied)
 same => n,Progress()                 ; early audio, so the phone plays our ring, not its own
 same => n,Playtones(ring)            ; ringback in the country set in indications.conf
 same => n,Wait(4.2)                  ; two UK rings; adjust for your country's cadence, or remove
 same => n,StopPlaytones()
 same => n,Answer()
 same => n,Dial(AudioSocket/127.0.0.1:9094/${UUID()}/c(slin16))
 same => n,Hangup()
 same => n(denied),Answer()
 same => n,Playback(ss-noservice)
 same => n,Hangup()

; Voicemail (201): messages sessions have left (read in their voices), and messages for
; sessions. The trusted phone (100) only.
exten => 201,1,GotoIf($["${CHANNEL(endpoint)}" != "100"]?denied)
 same => n,Progress()
 same => n,Playtones(ring)
 same => n,Wait(4.2)
 same => n,StopPlaytones()
 same => n,Answer()
 same => n,Dial(AudioSocket/127.0.0.1:9097/${UUID()}/c(slin16))
 same => n,Hangup()
 same => n(denied),Answer()
 same => n,Playback(ss-noservice)
 same => n,Hangup()

;;; Tests ##########################################################################

; Speech echo: say something and hear what speech-to-text made of it, in the operator's voice
exten => 601,1,Answer()
 same => n,Dial(AudioSocket/127.0.0.1:9093/${UUID()}/c(slin16))
 same => n,Hangup()

; Ringback test: dial, hang up after the beep, and the PBX rings you back 15 s later (time to
; lock the phone: checks calls get through Do Not Disturb). Answer for the audio echo test (699).
; Only phones (10X) are rung back. The call file's time is set in the future: Asterisk waits for it.
exten => 602,1,Answer()
 same => n,GotoIf($[${REGEX("^10[0-9]$" ${CALLERID(num)})}]?ok)
 same => n,Playback(ss-noservice)
 same => n,Hangup()
 same => n(ok),Set(F=/var/spool/asterisk/token-ring/ringback-${UNIQUEID}.call)
 same => n,Set(FILE(${F},,,al,u)=Channel: PJSIP/${CALLERID(num)})
 same => n,Set(FILE(${F},,,al,u)=CallerID: "Ringback test" <602>)
 same => n,Set(FILE(${F},,,al,u)=MaxRetries: 0)
 same => n,Set(FILE(${F},,,al,u)=WaitTime: 30)
 same => n,Set(FILE(${F},,,al,u)=Context: internal)
 same => n,Set(FILE(${F},,,al,u)=Extension: 699)
 same => n,Set(FILE(${F},,,al,u)=Priority: 1)
 same => n,System(touch -d '+15 seconds' ${F} && mv ${F} /var/spool/asterisk/outgoing/)
 same => n,Playback(beep)
 same => n,Hangup()

; Audio echo: hear yourself back (checks audio both ways, nothing else involved)
exten => 699,1,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

[token-ring-callback]
; Calls from sessions (`token-ring call`): the bridge writes a call file that rings the phone
; and, once answered, lands here; TRUUID tells the bridge which request it is. Not reachable
; from the phones, which are in [internal].
exten => s,1,Dial(AudioSocket/127.0.0.1:9094/${TRUUID}/c(slin16))
 same => n,Hangup()

[token-ring-messages]
; Texts from the trusted phone (SIP MESSAGE; pjsip.conf message_context): handed to the bridge as
; an AMI UserEvent. Texts to 200 go to the operator (ask a session to ring you back); any text
; stops voicemail reminders until there's new voicemail.
exten => _X.,1,UserEvent(TokenRingText,From: ${MESSAGE(from)},To: ${EXTEN},Body: ${BASE64_ENCODE(${MESSAGE(body)})})
exten => _[a-zA-Z].,1,UserEvent(TokenRingText,From: ${MESSAGE(from)},To: ${EXTEN},Body: ${BASE64_ENCODE(${MESSAGE(body)})})

[token-ring-no-texts]
; Texts from other endpoints: ignored
exten => _X.,1,NoOp(Ignoring a text from ${MESSAGE(from)})
exten => _[a-zA-Z].,1,NoOp(Ignoring a text from ${MESSAGE(from)})

[token-ring-app]
; Calls placed for the bridge's call apps ([bridge.apps], through AMI Originate): once answered,
; connected to the app's port with the request's UUID. Not reachable from the phones.
exten => s,1,Dial(AudioSocket/127.0.0.1:${TRPORT}/${TRUUID}/c(slin16))
 same => n,Hangup()
