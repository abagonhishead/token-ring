[global]
type = global
user_agent = token-ring

; UDP and TCP on 5060. TCP avoids fragmenting large SIP messages inside WireGuard.
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[transport-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0:5060

; Encrypted signalling on 5061: uncomment, and mount a certificate and key for the name your phones
; register to at /etc/asterisk/tls (compose.yaml). Then encrypt the audio too: media_encryption on
; the endpoint below. Asterisk reads the files when it starts, so restart it after a renewal.
;[transport-tls]
;type = transport
;protocol = tls
;bind = 0.0.0.0:5061
;cert_file = /etc/asterisk/tls/fullchain.pem
;priv_key_file = /etc/asterisk/tls/privkey.pem
;method = tlsv1_2              ; or tlsv1_3 if all your phones have it (pjproject's default is too old for OpenSSL)

;;; Templates ###################################################################

[endpoint-template](!)
type = endpoint
context = internal
disallow = all
allow = g722,ulaw,alaw
direct_media = no
; Cope with phones whose traffic is masqueraded on its way in
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
dtmf_mode = rfc4733
; Texts are ignored unless an endpoint says otherwise (the trusted phone, below)
message_context = token-ring-no-texts
language = en

[auth-template](!)
type = auth
auth_type = digest

[aor-template](!)
type = aor
max_contacts = 1
remove_existing = yes
qualify_frequency = 30
qualify_timeout = 10          ; phones on Wi-Fi can take a few seconds to answer

;;; Extensions ##################################################################

[100](endpoint-template)
auth = 100
aors = 100
callerid = "Phone" <100>
; Its texts go to the bridge: the operator (200), and replies to voicemail texts
message_context = token-ring-messages
; The voicemail light ([notify] via = ["mwi"]): Asterisk tells the phone the counts the bridge sets
mailboxes = 100@token-ring
; With TLS: insist on encrypted audio (SRTP, keys exchanged over the TLS connection)
;media_encryption = sdes
;media_encryption_optimistic = no

[100](aor-template)

[101](endpoint-template)
auth = 101
aors = 101
callerid = "Desk" <101>

[101](aor-template)

;;; Passwords ###################################################################
; The auth sections live outside the image: a file with, for each extension,
;   [100](auth-template)
;   username = 100
;   password = <a long random password>
; mounted at /run/secrets/pjsip_auth.conf (compose.yaml does this from pjsip_auth.conf).
#tryinclude /run/secrets/pjsip_auth.conf
